# https://tmuxcheatsheet.com/

##### PREFIX ############################################################

unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

##### TERMINAL ##########################################################

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set -sg escape-time 10
set -g focus-events on

##### MOUSE #############################################################

set -g mouse on
bind v if -F "#{mouse}" \
  "set -g mouse off; display-message 'Mouse disabled'" \
  "set -g mouse on; display-message 'Mouse enabled'"

##### COPY MODE #########################################################

setw -g mode-keys vi
set -g set-clipboard on

bind -n C-S-c run "tmux copy-pipe-and-cancel 'xclip -sel clip -i'"
bind -n C-S-v run "tmux set-buffer \"$(xclip -o -sel clip)\"; tmux paste-buffer"

bind M copy-mode

##### PANE MANAGEMENT ###################################################

bind-key b setw synchronize-panes \; display-message "Sync-Panes #{?pane_synchronized,on,off}"
bind-key z resize-pane -Z

bind | split-window -h
bind _ split-window -v

bind -n M-Left resize-pane -L
bind -n M-Right resize-pane -R
bind -n M-Up resize-pane -U
bind -n M-Down resize-pane -D

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### SESSION MANAGEMENT ###############################################

bind K kill-pane
bind X confirm-before -p "Kill all sessions? (y/n)" "kill-server"
bind r source-file ~/.tmux.conf \; display "Reloaded!"

##### WINDOW BEHAVIOR ###################################################

setw -g automatic-rename on

##### PERFORMANCE #######################################################

set -g history-limit 10000
set -g repeat-time 300

##### PLUGINS ###########################################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'spywhere/tmux-named-snapshot'
set -g @named-snapshot-save "S:*"
set -g @named-snapshot-restore "R:*"
bind-key g run-shell "${HOME}/.tmux/plugins/tmux-named-snapshot/scripts/tmux-fzf-restore.sh"
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'xamut/tmux-network-bandwidth'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'noscript/tmux-mighty-scroll'

##### STATUS BAR ########################################################

set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#181825,fg=#cdd6f4"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# Status Left: Hostname, Session and Path Pills
set -g status-left-length 100
set -g status-left "#[fg=#b4befe]#[bg=#181825]#[fg=#11111b]#[bg=#b4befe]#[bold]󰒋 #H #[fg=#b4befe]#[bg=#89b4fa]#[fg=#11111b]#[bg=#89b4fa]#[bold]  #S #[fg=#89b4fa]#[bg=#313244]#[fg=#cdd6f4]#[bg=#313244]#[nobold]  #{b:pane_current_path} #[fg=#313244]#[bg=#181825] "

# Inactive Windows
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#313244]#[bg=#181825]#[fg=#89b4fa]#[bg=#313244]#[bold]#I #[fg=#a6adc8]#[bg=#313244]#[nobold]#W#[fg=#313244]#[bg=#181825]"

# Active Window (Dual-tone pill)
setw -g window-status-current-format "#[fg=#89b4fa]#[bg=#181825]#[fg=#11111b]#[bg=#89b4fa]#[bold]#I #[fg=#89b4fa]#[bg=#313244]#[fg=#ffffff]#[bg=#313244]#[bold] #W #[fg=#313244]#[bg=#181825]"

# Status Right: Hardware Metrics + Toggle Icons (Bright Green #2FFF00 when ON) + Clock
set -g status-right-length 160
set -g status-right "#[fg=#313244]#[bg=#181825]#[fg=#fab387]#[bg=#313244] #{cpu_percentage}#[fg=#313244]#[bg=#181825] #[fg=#313244]#[bg=#181825]#[fg=#89dceb]#[bg=#313244] #{network_bandwidth}#[fg=#313244]#[bg=#181825] #[fg=#313244]#[bg=#181825]#[bg=#313244] #{?window_zoomed_flag,#[fg=#2FFF00],#[fg=#585b70]}  #{?pane_synchronized,#[fg=#2FFF00],#[fg=#585b70]}  #{?mouse,#[fg=#2FFF00]󰍽,#[fg=#585b70]󰍽} #[fg=#313244]#[bg=#181825] #[fg=#89b4fa]#[bg=#181825]#[fg=#11111b]#[bg=#89b4fa]#[bold] %H:%M:%S#[nobold]#[fg=#89b4fa]#[bg=#181825]"

# Messages and Command Prompt
set -g message-style "fg=#11111b,bg=#f9e2af,bold"
set -g message-command-style "fg=#11111b,bg=#89b4fa,bold"

##### TPM ###############################################################

run '~/.tmux/plugins/tpm/tpm'
